<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>배송지 수정 · 메이크스타 디자인 프로토타입</title>
  <link rel="stylesheet" href="address-ui/form.css">
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
</head>
<body>
<main>
  <section id="editor">
    <header><h1>배송지 수정</h1><button class="close" type="button" aria-label="닫기"><img src="address-ui/close.svg" alt=""></button></header>
    <aside>모든 항목을 올바르게 입력했는지 확인해 주세요. 잘못 입력한 정보로 인한 배송 지연, 오배송, 반송의 책임은 구매자에게 있습니다.</aside>
    <form id="form" autocomplete="off">
      <div class="form-body">
        <div class="group">
          <label>배송지<select name="source"><option>직접입력</option><option>예시 배송지</option></select></label>
          <label>배송지 이름<input name="nickname" required placeholder="예: 우리집"></label>
        </div>
        <div class="group">
          <label>배송 국가/지역<select name="country" required></select></label>
          <div id="ezway" hidden><strong>ⓘ　대만 배송은 EZ WAY 실명인증이 필요해요</strong><p>주문 시 입력한 수취인 정보(이름/연락처)와 EZ WAY 등록 정보가 동일해야 합니다.</p></div>
        </div>
        <div class="group">
          <label>받는 사람<input name="recipient" required placeholder="예: CHEN WEI TING"></label>
          <small class="tw" hidden>통관을 위해 EZ WAY에 등록된 영문 이름을 입력해 주세요.</small>
          <label>이메일<input name="email" type="email" required placeholder="예: young@email.com"></label>
          <label>전화번호<select name="dial" required aria-label="국가 전화번호"></select></label>
          <input name="phone" required type="tel" aria-label="전화번호" placeholder="예: 138 1234 5678">
          <small class="tw" hidden>통관을 위해 EZ WAY에 등록된 전화번호를 입력해 주세요.</small>
        </div>
        <div class="group fields" id="fields"></div>
        <label class="check"><input name="remember" type="checkbox" checked>새로운 배송지로 추가하기</label>
      </div>
      <footer><button type="button" id="cancel">취소</button><button class="primary" type="submit">수정하기</button></footer>
    </form>
    <div class="homebar" aria-hidden="true"></div>
  </section>
  <section id="summary" hidden>
    <button id="toggle" aria-expanded="true"><span class="pin"><img src="address-ui/location.svg" alt=""></span>배송 정보<img class="chevron" src="address-ui/up.svg" alt=""></button>
    <div id="summary-body">
      <div class="card"><div class="row"><strong id="who"></strong><button id="edit"><img src="address-ui/edit.svg" alt="">변경</button></div>
      <p id="phone"></p><p id="local"></p><small id="english"></small></div>
      <div class="request"><label>배송 요청사항<input maxlength="100" placeholder="배송 요청사항을 입력해주세요."></label><small>배송사 정책에 따라 한글 또는 영문만 입력할 수 있어요.</small></div>
    </div>
  </section>
</main>
<script src="address-ui/form.js"></script>
</body>
</html>
