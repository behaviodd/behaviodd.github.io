<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --fg: #e6e8ee;
      --fg-bright: #ffffff;
      --fg-muted: #b8bdc8;
      --fg-faint: #9fa7b3;
      --bg: #252b36;
      --panel: #343b48;
      --panel-strong: #3b4351;
      --code-bg: #1d222b;
      --accent: #7eb7ff;
      --accent-dim: rgba(126, 183, 255, 0.12);
      --accent-glow: rgba(126, 183, 255, 0.24);
      --accent-sub: #65d1d2;
      --accent-sub-dim: rgba(101, 209, 210, 0.12);
      --accent-sub-glow: rgba(101, 209, 210, 0.24);
      --accent-warm: #e97a62;
      --accent-status: #f1d28a;
      --border: #606875;
      --border-soft: #454d5a;
      --surface: rgba(255, 255, 255, 0.055);
      --font: "JetBrains Mono", "Pretendard", -apple-system, BlinkMacSystemFont, monospace;
    }

    html {
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.7;
      color: var(--fg);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #eef0f2;
    }

    ::-webkit-scrollbar-thumb {
      background: #8d949e;
      border: 2px solid #eef0f2;
      border-radius: 0;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #6f7783;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;
    }

    /* ── Selection ── */
    ::selection {
      background: rgba(92, 201, 202, 0.25);
      color: var(--fg-bright);
    }

    a:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--accent-status);
      outline-offset: 3px;
    }

    /* ── Header ── */
    header {
      padding: 18px 0;
      background: #202630;
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .site-prompt {
      color: var(--accent-status);
      text-decoration: none;
      font-size: 13px;
      white-space: nowrap;
      transition: text-shadow 0.2s;
    }

    .site-prompt:hover {
      text-shadow: 0 0 12px var(--accent-glow);
    }

    .blink {
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    nav {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    nav a {
      color: var(--fg-muted);
      text-decoration: none;
      font-size: 13px;
      padding: 4px 10px;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    nav a:hover,
    nav a.active {
      color: var(--accent-sub);
      border-color: var(--border);
      background: var(--panel);
      text-shadow: 0 0 8px var(--accent-sub-glow);
    }

    /* ── Back Link ── */
    .back-link {
      display: inline-block;
      font-size: 13px;
      color: var(--accent-sub);
      text-decoration: none;
      margin-bottom: 24px;
      transition: all 0.2s;
    }

    .back-link:hover {
      color: var(--accent-sub);
      text-shadow: 0 0 8px var(--accent-sub-glow);
    }

    /* ── Main ── */
    main {
      flex: 1;
      padding: 40px 0 64px;
    }

    /* ── ASCII Art ── */
    .ascii-art {
      font-family: var(--font);
      font-size: clamp(7px, 2.0vw, 13px);
      line-height: 1.15;
      color: var(--accent-sub);
      margin-bottom: 20px;
      overflow-x: auto;
      white-space: pre;
      user-select: none;
      opacity: 0.9;
    }

    /* ── Hero ── */
    .hero {
      margin-bottom: 48px;
      padding: 24px 24px 24px 28px;
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent-warm);
      background: var(--panel);
      position: relative;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.16);
    }

    .hero::before {
      content: '›';
      position: absolute;
      left: 9px;
      top: 10px;
      color: var(--fg-faint);
      font-weight: 700;
    }

    .hero h1 {
      font-size: clamp(22px, 5.5vw, 36px);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: 0;
      color: var(--fg-bright);
      margin-bottom: 8px;
    }

    .hero p {
      font-size: 13px;
      color: var(--fg-muted);
    }

    .hero .term-cmd {
      font-size: 13px;
      color: var(--accent-status);
      margin-bottom: 16px;
    }

    .hero .term-cmd span {
      color: var(--fg-muted);
    }

    /* ── Section Label ── */
    .section-label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--fg-bright);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .section-label::before {
      content: '/* ';
      color: var(--fg-faint);
    }

    .section-label::after {
      content: ' */';
      color: var(--fg-faint);
    }

    /* ── Projects ── */
    .project-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .project {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 10px 8px;
      text-decoration: none;
      color: inherit;
      transition: all 0.15s;
      background: rgba(52, 59, 72, 0.72);
      border: 1px solid transparent;
      border-left: 2px solid var(--border);
    }

    .project:hover {
      background: var(--panel-strong);
      border-color: var(--border);
      border-left-color: var(--accent-sub);
    }

    .project:hover .project-name {
      color: var(--accent);
      text-shadow: 0 0 8px var(--accent-glow);
    }

    .project:hover .arrow {
      color: var(--accent-sub);
      transform: translateX(2px);
    }

    .project-left {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }

    .project-prefix {
      color: var(--accent-sub);
      font-size: 13px;
      flex-shrink: 0;
      opacity: 0.7;
    }

    .project-name {
      font-size: 13px;
      color: var(--fg-bright);
      transition: all 0.15s;
    }

    .project-desc {
      font-size: 13px;
      color: var(--fg-faint);
      margin-left: auto;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Post list ── */
    .post-item {
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding: 10px 8px;
      text-decoration: none;
      color: inherit;
      transition: all 0.15s;
      background: rgba(52, 59, 72, 0.72);
      border: 1px solid transparent;
      border-left: 2px solid var(--border);
    }

    .post-item:hover {
      background: var(--panel-strong);
      border-color: var(--border);
      border-left-color: var(--accent-sub);
    }

    .post-item:hover .post-title {
      color: var(--accent);
      text-shadow: 0 0 8px var(--accent-glow);
    }

    .post-date {
      font-size: 13px;
      color: var(--accent-sub);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
      opacity: 1;
    }

    .post-title {
      font-size: 13px;
      color: var(--fg-bright);
      transition: all 0.15s;
    }

    .badge-new {
      display: inline-block;
      font-size: 10px;
      line-height: 1;
      color: #202630;
      background: var(--accent-status);
      border: 1px solid var(--accent-status);
      padding: 2px 5px;
      margin-left: 8px;
      letter-spacing: 1.5px;
      text-shadow: 0 0 6px var(--accent-sub-glow);
      vertical-align: baseline;
      border-radius: 2px;
    }

    /* ── Prose (blog content) ── */
    .prose {
      overflow-x: auto;
    }

    .prose h1 {
      font-size: 19px;
      font-weight: 400;
      margin: 0 0 16px;
      color: var(--fg-bright);
    }

    .prose h1::before {
      content: '# ';
      color: var(--accent-sub);
    }

    .prose h2 {
      font-size: 17px;
      font-weight: 400;
      margin: 40px 0 12px;
      color: var(--fg-bright);
    }

    .prose h2::before {
      content: '## ';
      color: var(--accent-sub);
    }

    .prose h3 {
      font-size: 15px;
      font-weight: 400;
      margin: 28px 0 10px;
      color: var(--fg-bright);
    }

    .prose h3::before {
      content: '### ';
      color: var(--accent-sub);
    }

    .prose p {
      margin-bottom: 16px;
    }

    .prose ul,
    .prose ol {
      margin: 0 0 16px 20px;
    }

    .prose li {
      margin-bottom: 4px;
    }

    .prose li::marker {
      color: var(--accent-sub);
    }

    .prose blockquote {
      border: 1px solid var(--border-soft);
      border-left: 3px solid var(--accent-warm);
      padding: 8px 16px;
      color: var(--fg);
      margin: 0 0 16px;
      background: var(--panel);
    }

    .prose blockquote > :last-child {
      margin-bottom: 0;
    }

    .prose code {
      font-family: var(--font);
      font-size: 13px;
      background: var(--code-bg);
      color: var(--accent-sub);
      padding: 2px 6px;
      border-radius: 2px;
    }

    .prose pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent-sub);
      padding: 16px;
      overflow-x: auto;
      margin-bottom: 16px;
    }

    .prose pre code {
      display: block;
      background: none;
      padding: 0;
      color: var(--fg);
    }

    /* ── Syntax highlighting (Rouge) ── */
    .highlight,
    .highlighter-rouge .highlight {
      background: transparent;
    }

    .highlight .c,
    .highlight .c1,
    .highlight .cm,
    .highlight .cs,
    .highlight .cp,
    .highlight .cd { color: #9fa7b3; font-style: italic; }

    .highlight .k,
    .highlight .kr,
    .highlight .kd,
    .highlight .kc,
    .highlight .kn,
    .highlight .kp,
    .highlight .ow { color: #c586c0; }

    .highlight .kt { color: #4ec9b0; }

    .highlight .s,
    .highlight .s1,
    .highlight .s2,
    .highlight .sb,
    .highlight .sc,
    .highlight .sh,
    .highlight .sx,
    .highlight .ss,
    .highlight .dl { color: #ce9178; }

    .highlight .se { color: #d7ba7d; }
    .highlight .sr { color: #d16969; }
    .highlight .si { color: #d7ba7d; }

    .highlight .m,
    .highlight .mi,
    .highlight .mf,
    .highlight .mh,
    .highlight .mo,
    .highlight .mb,
    .highlight .il { color: #b5cea8; }

    .highlight .nf,
    .highlight .fm { color: #dcdcaa; }

    .highlight .nc,
    .highlight .nn { color: #4ec9b0; }

    .highlight .nb,
    .highlight .bp { color: #4ec9b0; }

    .highlight .nx { color: var(--fg-bright); }

    .highlight .nl,
    .highlight .na,
    .highlight .py { color: #9cdcfe; }

    .highlight .nd { color: #dcdcaa; }

    .highlight .nv,
    .highlight .vc,
    .highlight .vg,
    .highlight .vi,
    .highlight .no { color: #9cdcfe; }

    .highlight .nt { color: #569cd6; }

    .highlight .o { color: var(--fg); }
    .highlight .p,
    .highlight .pi { color: #c8c8c8; }

    .highlight .err { color: #f48771; text-decoration: underline wavy; }

    .highlight .gd { color: #f48771; background: rgba(244,135,113,0.08); }
    .highlight .gi { color: #b5cea8; background: rgba(181,206,168,0.08); }
    .highlight .gh,
    .highlight .gu { color: var(--accent-sub); font-weight: 600; }
    .highlight .gs { font-weight: 600; }
    .highlight .ge { font-style: italic; }
    .highlight .gp { color: var(--accent); }

    .prose hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }

    .prose img {
      max-width: 100%;
      height: auto;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      background: var(--panel);
    }

    .prose h4 {
      font-size: 13px;
      font-weight: 600;
      margin: 24px 0 8px;
      color: var(--fg-bright);
    }

    .prose h4::before {
      content: '#### ';
      color: var(--accent-sub);
      font-weight: 400;
    }

    .prose table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .prose th {
      text-align: left;
      padding: 6px 10px;
      color: var(--accent-sub);
      border-bottom: 1px solid var(--accent-sub);
      font-weight: 400;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .prose td {
      padding: 5px 10px;
      border-bottom: 1px solid var(--border-soft);
      color: var(--fg);
      vertical-align: top;
    }

    .prose tbody tr:hover {
      background: var(--accent-dim);
    }

    .prose td code {
      font-size: 12px;
    }

    /* ── Collapsible block (기술 상세) ── */
    .prose details {
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent-status);
      background: var(--panel);
      padding: 0 16px;
      margin: 32px 0;
    }

    .prose details[open] {
      border-color: var(--accent-sub);
    }

    .prose summary {
      cursor: pointer;
      list-style: none;
      margin: 0 -16px;
      padding: 12px 16px;
      color: var(--accent-sub);
      font-size: 13px;
      user-select: none;
    }

    .prose summary::-webkit-details-marker {
      display: none;
    }

    .prose summary::before {
      content: '[+] ';
    }

    .prose details[open] > summary::before {
      content: '[-] ';
    }

    .prose summary:hover {
      color: var(--fg-bright);
      text-shadow: 0 0 8px var(--accent-sub-glow);
    }

    .prose details[open] > summary {
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    /* 접힘 영역 안에서는 h2가 최상위라 상단 여백을 줄인다 */
    .prose details > h2:first-of-type {
      margin-top: 0;
    }

    .prose a {
      color: var(--accent);
      text-decoration: none;
    }

    .prose a:hover {
      text-decoration: underline;
      text-shadow: 0 0 8px var(--accent-glow);
    }

    /* ── Profile ── */
    .profile-section {
      margin-bottom: 48px;
    }

    .profile-list {
      display: flex;
      flex-direction: column;
    }

    .profile-row {
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding: 10px 8px;
    }

    .profile-row dt {
      font-size: 13px;
      color: var(--accent-sub);
      flex-shrink: 0;
      min-width: 80px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .profile-row dd {
      font-size: 13px;
      color: var(--fg-bright);
    }

    .profile-row dd a {
      color: var(--accent);
      text-decoration: none;
    }

    .profile-row dd a:hover {
      text-decoration: underline;
      text-shadow: 0 0 8px var(--accent-glow);
    }

    /* ── Footer ── */
    footer {
      padding: 24px 0;
      background: #202630;
      border-top: 1px solid var(--border);
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--fg-faint);
      letter-spacing: 0.5px;
    }

    .footer-inner .status {
      color: var(--accent-status);
      opacity: 1;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .project {
        flex-wrap: wrap;
      }

      .project-desc {
        margin-left: 28px;
      }

      .header-inner {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .hero {
        padding: 18px 16px 18px 22px;
      }

      .post-item {
        align-items: flex-start;
        gap: 6px;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container">
      <div class="header-inner">
        <a href="/" class="site-prompt">cheonjiyoung@nvy:~$<span class="blink">_</span></a>
        <nav>
          <a href="/"{% if page.title == "Home" %} class="active"{% endif %}>home</a>
          <a href="/blog/"{% if page.title == "Blog" or page.layout == "post" %} class="active"{% endif %}>blog</a>
          <a href="/profile/"{% if page.title == "Profile" %} class="active"{% endif %}>profile</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      {% if page.title != "Home" %}
      <a href="javascript:history.back()" class="back-link">&lt; cd ..</a>
      {% endif %}
      {{ content }}
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-inner">
        <span>&copy; 2026 {{ site.title }}</span>
        <span class="status">all systems operational</span>
      </div>
    </div>
  </footer>

</body>

</html>
