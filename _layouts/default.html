<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
  <link rel="icon" type="image/png" href="{{ '/assets/identity/monogram.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
</head>
<body id="top">
  <a class="skip" href="#content">본문으로 이동</a>
  <header class="mast">
    <div class="wrap mast-inner">
      <a class="signature" href="{{ '/' | relative_url }}" lang="en">{{ site.title }}</a>
      <nav aria-label="주 메뉴">
        {% assign routes = 'profile|/about/,works|/works/' | split: ',' %}
        {% for route in routes %}{% assign item = route | split: '|' %}
        <a href="{{ item[1] | relative_url }}"{% if page.url == item[1] %} aria-current="page"{% elsif page.collection == 'work' and item[0] == 'works' %} aria-current="location"{% endif %}>{{ item[0] }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>
  <main id="content" class="wrap" tabindex="-1">{{ content }}</main>
<script src="{{ '/assets/js/philosophy.js' | relative_url }}" defer></script>
</body>
</html>
