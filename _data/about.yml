name: 천지영
role: Product Designer
linkedin: https://www.linkedin.com/in/nvydec/
philosophy:
  - title: 복잡한 문제를 실행 가능한 제품으로 구조화합니다.
    text: 사용자 요구, 운영 정책, 비즈니스 목표와 기술적 제약이 충돌하는 지점을 찾습니다. 화면을 설계하기 전에 워크플로우와 정책, 예외 상황을 정리합니다.
  - title: 개인의 역량을 팀이 사용할 수 있는 시스템으로 확장합니다.
    text: 한 번의 좋은 결과보다 반복해서 좋은 결과를 만들 수 있는 구조를 중요하게 생각합니다. 디자인 시스템과 가이드, 업무 흐름을 팀이 함께 쓸 수 있도록 만듭니다.
  - title: 다양한 직군이 더 좋은 결정을 내릴 수 있도록 돕습니다.
    text: PM, 엔지니어, 운영 담당자와 설계 초기부터 협업합니다. 복잡한 정보를 구조화하고 선택지를 명확하게 만들어 팀의 의사결정을 돕습니다.
  - title: AI로 탐색과 실행의 거리를 줄입니다.
    text: 리서치, 요구사항 정리, UX Writing, 프로토타이핑과 반복 업무 자동화에 AI를 활용합니다. 아이디어를 빠르게 동작하는 형태로 검증합니다.
